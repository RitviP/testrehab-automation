name: Selenium CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Run Tests
    run: ./mvnw clean test -Dtest=CareProfileCreationTest -Dheadless=true

   - name: Run Tests
     run: mvn clean test -Dheadless=true

    # ✅ Upload TestNG / Extent Reports
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-output/

    # ✅ Upload Screenshots (if any failures)
    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: test-output/screenshots/